<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praecipe</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="toolbar-top">
    <div class="brand">Praecipe</div>
    <input id="search" type="search" placeholder="Search" autocomplete="off">
    <span id="timer-chip" class="chip hidden"></span>
    <button type="button" id="btn-sync" class="ghost">Get Mail</button>
    <button type="button" id="btn-compose" class="primary">New Message</button>
  </header>
  <div id="reminders" class="reminders hidden"></div>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main id="app"></main>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>
  <p class="disclaimer">Practice aid only · Fla. Fam. L. R. P. 12.090 / Rule 2.514 · N new · R reply · A reply all · F forward · Del · J/K · / search</p>
  <script src="/app.js"></script>
</body>
</html>
